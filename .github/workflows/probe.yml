name: Kaynak yoklama (geçici)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: >
          node scripts/probe.mjs
          https://www.eczaneler.gen.tr/nobetci-istanbul
          https://www.eczaneler.gen.tr/nobetci-istanbul-kadikoy
          https://www.turkiye.gov.tr/saglik-titck-nobetci-eczane-sorgu
          https://www.istanbuleczaciodasi.org.tr/nobetci-eczane/
