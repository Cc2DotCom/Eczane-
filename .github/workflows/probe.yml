name: Kaynak yoklama (geçici)
on:
  workflow_dispatch:
    inputs:
      cmd:
        description: 'Çalıştırılacak komut'
        required: true
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: ${{ inputs.cmd }}
