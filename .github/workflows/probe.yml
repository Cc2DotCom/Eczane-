name: Kaynak sayfa denemesi

# Yeni bir nöbet kaynağı eklemeden önce sayfaların yapısını görmek için:
# verilen adresleri indirir ve probe-out dalına kaydeder.
on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Boşlukla ayrılmış adresler'
        required: true

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sayfaları indir
        env:
          URLS: ${{ inputs.urls }}
        run: |
          mkdir out && cd out
          i=0
          for u in $URLS; do
            i=$((i+1))
            code=$(curl -sL -m 25 -A "Mozilla/5.0 (Linux; Android 14) NobetciEczane/1.0" -o "$i.html" -w "%{http_code} %{url_effective}" "$u" || echo "ERR")
            echo "$i $code $u" >> index.txt
          done
          cat index.txt
      - name: probe-out dalına kaydet
        run: |
          cd out
          git init -q -b probe-out
          git config user.name probe-bot
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "probe ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
