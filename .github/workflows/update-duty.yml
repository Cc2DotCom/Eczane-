name: Nöbet listesini güncelle

on:
  schedule:
    # Türkiye saatiyle 09:15 (nöbet günü 09:00'da değişir). 12:15'teki ikinci çalışma
    # yalnızca ilkinde alınamayan illeri dener; güncel iller atlanır.
    - cron: '15 6 * * *'
    - cron: '15 9 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Bugünün listesi olsa bile yeniden çek'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-duty
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Nöbetçi eczaneleri e-Devlet'ten çek
        run: node scripts/update-duty.mjs ${{ inputs.force && '--force' || '' }}
      - name: Değişiklikleri kaydet
        if: always()
        run: |
          git config user.name "nobet-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api data
          if git diff --cached --quiet; then
            echo "Değişiklik yok"
          else
            git commit -m "Nöbet listesi: $(date -u +%F)"
            git pull --rebase -q origin main
            git push
          fi
