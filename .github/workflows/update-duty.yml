name: Nöbet listesini güncelle

on:
  schedule:
    # Türkiye saatiyle 09:05 (nöbet 08:30'da değişir). 10:05'teki ikinci çalışma
    # yalnızca ilki başarısız olduysa API'ye gider; liste güncelse hiçbir şey yapmaz.
    - cron: '5 6 * * *'
    - cron: '5 7 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Bugünün listesi olsa bile yeniden çek'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-duty
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Nöbetçi eczaneleri çek
        env:
          COLLECTAPI_KEY: ${{ secrets.COLLECTAPI_KEY }}
        run: node scripts/update-duty.mjs ${{ inputs.force && '--force' || '' }}
      - name: Değişiklikleri kaydet
        if: always()
        run: |
          git config user.name "nobet-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api
          if git diff --cached --quiet; then
            echo "Değişiklik yok"
          else
            git commit -m "Nöbet listesi: $(date -u +%F)"
            git push
          fi
